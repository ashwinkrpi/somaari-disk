[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "somaari-disk"
dynamic = ["version"]
description = "Desktop disk usage analyzer"
license = "MIT"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
authors = [{ name = "Ashwin Koppam Raghavendra", email = "75906461+ashwinkrpi@users.noreply.github.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pywebview>=5",
    "platformdirs>=4",
    "psutil>=5.9",
    "send2trash>=1.8",
    "somaari-common @ git+https://github.com/ashwinkrpi/somaari-common#subdirectory=python",
]

[project.urls]
Homepage = "https://github.com/ashwinkrpi/somaari-disk"
Issues = "https://github.com/ashwinkrpi/somaari-disk/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3", "packaging>=23"]

[project.scripts]
somaari-disk = "somaari_disk.__main__:main"

[tool.hatch.version]
path = "src/somaari_disk/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/somaari_disk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
