[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "disk-usage-analyzer"
version = "0.0.1"
description = "Desktop disk usage analyzer"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pywebview>=5",
    "platformdirs>=4",
    "psutil>=5.9",
    "send2trash>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3"]

[project.scripts]
disk-usage-analyzer = "disk_usage_analyzer.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/disk_usage_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
