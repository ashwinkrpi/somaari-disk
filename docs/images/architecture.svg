<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 546" width="640" height="546" role="img" aria-labelledby="title desc">
  <title id="title">How somaari-disk works</title>
  <desc id="desc">The window calls the api layer through pywebview. The api starts the core scanner, which reads your drives read-only through the platform layer and sends progress events back to the window. The api also moves confirmed items to the Trash or Recycle Bin, and reads and writes saved scans.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#a9b6c6"/>
    </marker>
    <style>
      text { font-family: "DejaVu Sans", "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
      .box { fill: #1e2b3b; stroke: #2c3d52; stroke-width: 2; }
      .client { fill: #0b1119; stroke: #4c8ddb; stroke-width: 2; }
      .store { fill: #0b1119; stroke: #f2cf7a; stroke-width: 2; }
      .name { fill: #ffffff; font-size: 19px; font-weight: 600; }
      .sub { fill: #c9d4e0; font-size: 15px; }
      .label { fill: #a9b6c6; font-size: 14px; text-anchor: start; }
      .flow { fill: none; stroke: #a9b6c6; stroke-width: 2; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
      .dashed { stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect width="640" height="546" rx="16" fill="#0b1119"/>

  <!-- Flows -->
  <path class="flow" d="M230 84 V144"/>
  <path class="flow" d="M230 210 V252"/>
  <path class="flow" d="M150 318 V356"/>
  <path class="flow" d="M150 422 V460"/>
  <path class="flow" d="M310 178 H348"/>
  <path class="flow both" d="M290 212 V286 H348"/>
  <path class="flow dashed" d="M45 254 V86"/>

  <!-- Flow labels -->
  <text class="label" x="242" y="110">pywebview</text>
  <text class="label" x="242" y="130">js_api</text>
  <text class="label" x="55" y="172">progress</text>
  <text class="label" x="55" y="192">events</text>
  <text class="label" x="350" y="122">Move to Trash,</text>
  <text class="label" x="350" y="140">confirmed</text>

  <!-- Main path -->
  <rect class="client" x="30" y="20" width="280" height="64" rx="10"/>
  <text class="name" x="170" y="45">Window</text>
  <text class="sub" x="170" y="68">HTML · CSS · JS</text>

  <rect class="box" x="150" y="146" width="160" height="64" rx="10"/>
  <text class="name" x="230" y="171">api/</text>
  <text class="sub" x="230" y="194">plain JSON</text>

  <rect class="box" x="30" y="254" width="240" height="64" rx="10"/>
  <text class="name" x="150" y="279">core/ scanner</text>
  <text class="sub" x="150" y="302">thread pool</text>

  <rect class="box" x="30" y="358" width="240" height="64" rx="10"/>
  <text class="name" x="150" y="383">platform/</text>
  <text class="sub" x="150" y="406">linux · windows</text>

  <rect class="store" x="30" y="462" width="240" height="64" rx="10"/>
  <text class="name" x="150" y="487">Your drives</text>
  <text class="sub" x="150" y="510">read-only</text>

  <!-- What the api also touches -->
  <rect class="store" x="350" y="150" width="260" height="56" rx="10"/>
  <text class="name" x="480" y="185">Trash / Recycle Bin</text>

  <rect class="store" x="350" y="254" width="260" height="64" rx="10"/>
  <text class="name" x="480" y="279">Saved scans</text>
  <text class="sub" x="480" y="302">gzip JSON Lines</text>
</svg>
