<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Somaari Disk</title>
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top" aria-label="Location">
    <div class="top-row">
      <h1 class="app-title">Somaari Disk</h1>
      <label class="location">
        <span class="location-label">Location</span>
        <select id="location" disabled></select>
      </label>
      <button id="up" class="icon-btn" type="button" title="Up one folder (Alt+Up)" aria-label="Up one folder" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5l-7 7h4.5v7h5v-7H19z"/></svg>
      </button>
      <div class="spacer"></div>
      <label class="theme">
        <span class="visually-hidden">Theme</span>
        <select id="theme" title="Theme">
          <option value="system">System theme</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
      <button id="rescan" class="btn" type="button" title="Rescan (F5)" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.7 6.3A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.8-4.2L13 11h7V4z"/></svg>
        <span id="rescan-label">Rescan</span>
      </button>
    </div>
    <nav class="crumbs" aria-label="Breadcrumb">
      <ol id="breadcrumb"></ol>
    </nav>
  </header>
  <section id="usage" class="usage" aria-label="Drive usage" hidden>
    <div class="usage-row">
      <p id="usage-state" class="usage-state"></p>
      <p id="usage-text" class="usage-text"></p>
    </div>
    <div id="usage-bar" class="usage-bar" role="progressbar" aria-label="Space used"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="usage-fill" class="usage-fill"></div>
      <span class="tick tick-50" aria-hidden="true"></span>
      <span class="tick tick-75" aria-hidden="true"></span>
    </div>
    <p id="usage-scope" class="usage-scope" hidden></p>
  </section>
  <main id="main" class="body">
    <section class="card list-panel" aria-labelledby="list-title">
      <header class="panel-head">
        <h2 id="list-title">Largest items</h2>
        <p id="list-meta" class="panel-meta"></p>
      </header>
      <div id="notice" class="notice" role="status" hidden></div>
      <ul id="rows" class="rows" aria-labelledby="list-title"></ul>
      <div id="list-state" class="state" aria-live="polite" hidden></div>
    </section>
    <aside id="side" class="card side" aria-label="Selection details" hidden></aside>
  </main>
  <dialog id="confirm" class="dialog" aria-labelledby="confirm-title" aria-describedby="confirm-note">
    <form method="dialog">
      <h2 id="confirm-title">Move to Trash?</h2>
      <dl class="facts">
        <dt>Name</dt><dd id="confirm-name"></dd>
        <dt>Size</dt><dd id="confirm-size"></dd>
      </dl>
      <p id="confirm-note" class="dialog-note">You can restore it from the Trash until the Trash is emptied. The space is freed when the Trash is emptied.</p>
      <div class="dialog-actions">
        <button id="confirm-cancel" class="action" value="cancel">Cancel</button>
        <button id="confirm-ok" class="action danger" value="trash">Move to Trash</button>
      </div>
    </form>
  </dialog>
</body>
</html>
