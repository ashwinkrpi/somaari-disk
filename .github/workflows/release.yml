name: Release
# Push to main: build everything as run artifacts (Actions > run > Artifacts, kept 90 days).
# Push a tag vX.Y.Z (matching pyproject version): also make a DRAFT release; publish by hand.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "design/**"] # not applied to tag pushes
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      # full runtime deps (no GTK) so the license test walks the real dependency tree
      - run: pip install pywebview platformdirs psutil send2trash pytest ruff packaging
      - run: pip install --no-deps -e .
      - run: ruff check . && ruff format --check .
        shell: bash
      - run: pytest -q

  python:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python
          path: dist/*

  deb:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python packaging/linux/build_deb.py
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  deb-smoke:
    needs: deb
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb
      - name: Install and run CLI from the package
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ./somaari-disk_*_all.deb
          somaari-disk volumes
          /usr/bin/python3 -c "import sys; sys.path.insert(0, '/usr/lib/somaari-disk'); import webview, somaari_disk.app"
          desktop-file-validate /usr/share/applications/somaari-disk.desktop || true
          sudo apt-get remove -y -q somaari-disk
          test ! -e /usr/lib/somaari-disk/somaari_disk

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pyinstaller
      - run: pyinstaller --noconfirm --distpath dist --workpath build/pyinstaller packaging/windows/somaari-disk.spec
      - name: Check the frozen app
        shell: bash
        run: |
          test -f dist/somaari-disk/somaari-disk.exe
          find dist/somaari-disk -name index.html -path '*somaari_disk/ui*' | grep -q .
          find dist/somaari-disk -name 'IBMPlexSans-Regular.woff2' | grep -q .
          find dist/somaari-disk -name 'Python.Runtime.dll' | grep -q .
      - name: Version
        id: v
        shell: bash
        run: echo "version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist/somaari-disk -DestinationPath "dist/somaari-disk-${{ steps.v.outputs.version }}-windows-x64.zip"
      - name: Installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /Qp "/DAppVersion=${{ steps.v.outputs.version }}" packaging\windows\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*-setup.exe

  release:
    needs: [python, deb-smoke, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "$GITHUB_REF_NAME"
